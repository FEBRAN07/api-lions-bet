services:
    - type: web
      name: api-lions-bet
      runtime: node
      plan: free
      buildCommand: "npm install"
      startCommand: "npm start"
      autoDeploy: true
      envVars:
          - key: NODE_ENV
            value: "production"
          - key: MONGO_URI
            sync: false
          - key: JWT_SECRET
            generateValue: true
          - key: JWT_EXPIRES_IN
            value: "id"
          - key: BCRYPT_SALT_ROUNDS
            value: 10
